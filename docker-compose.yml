# ============================================================
# PLM Core - Docker Compose
#
# Usage:
#   ./run.sh          # start + watch for changes
#   ./run.sh --build  # force full rebuild before starting
#
# Access:
#   Frontend : http://localhost:3000
#   Gateway  : http://localhost:8082 (sole external API entry point)
# ============================================================

services:

  # ============================================================
  # Jaeger — OpenTelemetry traces UI + OTLP collector (all-in-one)
  #   UI:            http://localhost:16686
  #   OTLP/HTTP in:  4318 (services push traces here)
  #   OTLP/gRPC in:  4317
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
      - "4317:4317"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - plm-net

  # ============================================================
  # HashiCorp Vault — secret store (demo: file backend, single-shard unseal)
  # Unseal key + root token persist on the plm-vault-init volume as plaintext.
  # DEMO ONLY. See vault/bootstrap.sh for the one-shot seed logic.
  # ============================================================
  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    cap_add: [IPC_LOCK]
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - plm-vault-file:/vault/file
      - plm-vault-init:/vault/init
      - ./vault/config.hcl:/vault/config/config.hcl:ro,z
    entrypoint: vault server -config=/vault/config/config.hcl
    healthcheck:
      # sealedcode=200 treats "sealed" as healthy; uninitcode=200 treats "not initialized" as healthy.
      # vault-bootstrap then unseals + seeds.
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - plm-net

  vault-bootstrap:
    image: hashicorp/vault:1.17
    container_name: vault-bootstrap
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      PLM_SERVICE_SECRET: ${PLM_SERVICE_SECRET:?Set PLM_SERVICE_SECRET in .env (must be >= 32 bytes)}
      PG_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env (see .env.example)}
    volumes:
      - plm-vault-init:/vault/init
      - ./vault/bootstrap.sh:/bootstrap.sh:ro,z
    entrypoint: /bin/sh
    command: ["/bootstrap.sh"]
    restart: "no"
    networks:
      - plm-net

  # ============================================================
  # PostgreSQL 16
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: plm-postgres
    environment:
      POSTGRES_DB:       plmdb
      POSTGRES_USER:     plm
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - plm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plm -d plmdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - plm-net

  # ============================================================
  # NATS — pub/sub messaging bus
  #   Client:     nats://nats:4222
  #   Monitoring: http://localhost:8222
  # ============================================================
  nats:
    image: nats:2.10-alpine
    container_name: plm-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - plm-net

  # ============================================================
  # Garage — S3-compatible object store. dst stores all binary
  # blobs here; the DOWNLOAD action hands the browser a presigned
  # URL that hits the S3 API (port 3900) directly.
  # ============================================================
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: garage
    environment:
      GARAGE_RPC_SECRET:  ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
      # Quiet the per-connection handshake + "Proxied admin API request" INFO spam.
      # warn keeps real warnings/errors. Override via GARAGE_LOG_LEVEL in .env.
      RUST_LOG: ${GARAGE_LOG_LEVEL:-warn}
    ports:
      - "3900:3900"   # S3 API — host-published: browser hits presigned URLs here
      - "3903:3903"   # admin API
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro,z
      - plm-garage-meta:/var/lib/garage/meta
      - plm-garage-data:/var/lib/garage/data
    command: ["/garage", "server"]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - plm-net

  # ============================================================
  # Garage bootstrap — one-shot: applies cluster layout, creates
  # the dst bucket, imports the fixed S3 key, grants permissions.
  # ============================================================
  garage-bootstrap:
    # node:20-slim ships global fetch + JSON — no curl/jq/apk needed, so this
    # works in locked-down envs with no package network. Image already pulled
    # for cad-parser.
    image: node:20-slim
    container_name: garage-bootstrap
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_TOKEN:   ${GARAGE_ADMIN_TOKEN:?}
      GARAGE_S3_ACCESS_KEY: ${GARAGE_S3_ACCESS_KEY:?}
      GARAGE_S3_SECRET_KEY: ${GARAGE_S3_SECRET_KEY:?}
      GARAGE_S3_BUCKET:     ${GARAGE_S3_BUCKET:-plm-dst}
    volumes:
      - ./garage/bootstrap.mjs:/bootstrap.mjs:ro,z
    entrypoint: ["node", "/bootstrap.mjs"]
    restart: "no"
    networks:
      - plm-net

  # ============================================================
  # PNO API — People & Organisation microservice (internal only)
  # ============================================================
  pno-api:
    build:
      context: .
      dockerfile: pno-api/Dockerfile
      target: runtime
    image: pno-api:dev
    container_name: pno-api
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres:5432/plmdb
      SPRING_DATASOURCE_USERNAME:          plm
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_HIKARI_SCHEMA:     pno
      SPRING_JOOQ_SQL_DIALECT:             POSTGRES
      SPRING_FLYWAY_LOCATIONS:             classpath:db/migration
      SPRING_FLYWAY_DEFAULT_SCHEMA:        pno
      SPRING_FLYWAY_CREATE_SCHEMAS:        "true"
      # PLM_SERVICE_SECRET + PG_PASSWORD now resolved at bootstrap from Vault (secret/plm).
      VAULT_ADDR:                          http://vault:8200
      VAULT_TOKEN:                         plm-demo-services
      SPE_API_URL:                         http://spe-api:8082
      SPE_SELF_BASE_URL:                   http://pno-api:8081
      MANAGEMENT_OTLP_TRACING_ENDPOINT:    http://jaeger:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      LOGGING_LEVEL_ROOT:                  INFO
      LOGGING_LEVEL_COM_PNO:               INFO
      PLM_SETTINGS_ENABLED:                "true"
      PLM_PLATFORM_URL:                    http://platform-api:8084
      NATS_URL:                            nats://nats:4222
      PLM_NATS_ENABLED:                    "true"
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - plm-net

  # ============================================================
  # PSM Admin — Config/metamodel source of truth (internal only)
  # ============================================================
  psm-admin:
    build:
      context: .
      dockerfile: psm-admin/Dockerfile
      target: runtime
    image: psm-admin:dev
    container_name: psm-admin
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres:5432/plmdb
      SPRING_DATASOURCE_USERNAME:          plm
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JOOQ_SQL_DIALECT:             POSTGRES
      SPRING_FLYWAY_LOCATIONS:             classpath:db/migration
      SPRING_FLYWAY_DEFAULT_SCHEMA:        psm_admin
      SPRING_FLYWAY_CREATE_SCHEMAS:        "true"
      SPRING_DATASOURCE_HIKARI_SCHEMA:     psm_admin
      VAULT_ADDR:                          http://vault:8200
      VAULT_TOKEN:                         plm-demo-services
      SPE_API_URL:                         http://spe-api:8082
      SPE_SELF_BASE_URL:                   http://psm-admin:8083
      MANAGEMENT_OTLP_TRACING_ENDPOINT:    http://jaeger:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      LOGGING_LEVEL_ROOT:                  INFO
      LOGGING_LEVEL_COM_PLM:               INFO
      PLM_SETTINGS_ENABLED:                "true"
      PLM_PLATFORM_URL:                    http://platform-api:8084
      PLM_PERMISSION_ENABLED:              "true"
      PLM_PERMISSION_PNO_URL:              http://pno-api:8081
      NATS_URL:                            nats://nats:4222
      PLM_NATS_ENABLED:                    "true"
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - plm-net

  # ============================================================
  # PSM API — Product Structure Management microservice (internal only)
  # Two replicas sharing the same PostgreSQL schema (psm).
  # Each replica self-registers with its own DNS hostname and space tag,
  # so spe-api routes project spaces to the correct instance.
  # Flyway creates and migrates each schema independently.
  # ============================================================
  psm-api-1:
    build:
      context: .
      dockerfile: psm-api/Dockerfile
      target: runtime
    image: psm-api:dev
    container_name: psm-api-1
    environment: &psm-env
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres:5432/plmdb
      SPRING_DATASOURCE_USERNAME:          plm
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JOOQ_SQL_DIALECT:             POSTGRES
      SPRING_FLYWAY_LOCATIONS:             classpath:db/migration
      SPRING_FLYWAY_DEFAULT_SCHEMA:        ${PSM_SCHEMA:-psm}
      SPRING_FLYWAY_CREATE_SCHEMAS:        "true"
      SPRING_DATASOURCE_HIKARI_SCHEMA:     ${PSM_SCHEMA:-psm}
      # PLM_SERVICE_SECRET + PG_PASSWORD now resolved at bootstrap from Vault (secret/plm).
      VAULT_ADDR:                          http://vault:8200
      VAULT_TOKEN:                         plm-demo-services
      SPE_API_URL:                         http://spe-api:8082
      MANAGEMENT_OTLP_TRACING_ENDPOINT:    http://jaeger:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      LOGGING_LEVEL_ROOT:                  INFO
      LOGGING_LEVEL_COM_PLM:               INFO
      SPE_SELF_BASE_URL:                   http://psm-api-1:8080
      SPE_SPACE_TAG:                       ${SPE_PSM1_TAG:-PSM1}
      PSM_CONFIG_ADMIN_URL:                http://psm-admin:8083
      PSM_CONFIG_SERVICE_CODE:             psm-data
      PSM_CONFIG_SELF_BASE_URL:            http://psm-api-1:8080
      PLM_SETTINGS_ENABLED:                "true"
      PLM_PLATFORM_URL:                    http://platform-api:8084
      NATS_URL:                            nats://nats:4222
      PLM_NATS_ENABLED:                    "true"
      CAD_API_INTERNAL_URL:                http://cad-api:8087
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      psm-admin:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - plm-net

  psm-api-2:
    build:
      context: .
      dockerfile: psm-api/Dockerfile
      target: runtime
    image: psm-api:dev
    container_name: psm-api-2
    environment:
      <<: *psm-env
      SPRING_FLYWAY_DEFAULT_SCHEMA:        ${PSM_SCHEMA:-psm}
      SPRING_DATASOURCE_HIKARI_SCHEMA:     ${PSM_SCHEMA:-psm}
      SPE_SELF_BASE_URL:                   http://psm-api-2:8080
      SPE_SPACE_TAG:                       ${SPE_PSM2_TAG:-PSM2}
      PSM_CONFIG_ADMIN_URL:                http://psm-admin:8083
      PSM_CONFIG_SERVICE_CODE:             psm-data
      PSM_CONFIG_SELF_BASE_URL:            http://psm-api-2:8080
      PLM_SETTINGS_ENABLED:                "true"
      PLM_PLATFORM_URL:                    http://platform-api:8084
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      psm-admin:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - plm-net

  # ============================================================
  # Platform API — Central settings aggregator + Vault admin (in-memory, no DB)
  # ============================================================
  platform-api:
    build:
      context: .
      dockerfile: platform-api-rs/Dockerfile
      target: runtime
    image: platform-api:dev
    container_name: platform-api
    environment:
      # Go/Rust rewrite — secret injected directly (same value Vault seeds for
      # the Java services, so forward JWTs verify across the mesh).
      PLM_SERVICE_SECRET:                  ${PLM_SERVICE_SECRET:?}
      SPE_SELF_BASE_URL:                   http://platform-api:8084
      PLM_PLATFORM_URL:                    http://platform-api:8084
      OTEL_EXPORTER_OTLP_ENDPOINT:         http://jaeger:4318
      NATS_URL:                            nats://nats:4222
      NATS_MONITORING_URL:                 http://nats:8222
      PLM_NATS_ENABLED:                    "true"
      PNO_API_URL:                         http://pno-api:8081
      PLATFORM_EXPECTED_SERVICES:          psm,pno,psa,platform,ws,spe,dst,cad,dav
      # Owns the `platform` Postgres schema (discrete fields; sqlx applies migrations).
      PG_HOST:                             postgres
      PG_USER:                             plm
      PG_DB:                               plmdb
      PG_PASSWORD:                         ${PG_PASSWORD:?}
      PLATFORM_DB_SCHEMA:                  platform
      # Vault admin (CRUD secrets) only.
      VAULT_ADDR:                          http://vault:8200
      VAULT_TOKEN:                         plm-demo-services
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - plm-net

  # ============================================================
  # WS Gateway — WebSocket relay backed by NATS pub/sub
  # ============================================================
  ws-gateway:
    build:
      context: .
      dockerfile: ws-gateway-go/Dockerfile
      target: runtime
    image: ws-gateway:dev
    container_name: ws-gateway
    environment:
      # Go rewrite — secret injected directly (same value Vault seeds for the
      # Java services, so the forward JWT minted by spe-api verifies here).
      PLM_SERVICE_SECRET:                  ${PLM_SERVICE_SECRET:?}
      PLM_PLATFORM_URL:                    http://platform-api:8084
      SPE_SELF_BASE_URL:                   http://ws-gateway:8085
      NATS_URL:                            nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT:         http://jaeger:4318
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - plm-net

  # ============================================================
  # WebDAV — read-only WebDAV façade over PSM (serviceCode dav).
  # Stateless: tree from psm/pno, metamodel flags from psm-admin
  # snapshot, file bytes proxied from dst.
  # ============================================================
  webdav:
    build:
      context: .
      dockerfile: webdav-go/Dockerfile
      target: runtime
    image: webdav:dev
    container_name: webdav
    environment:
      # Go rewrite — secret injected directly (same value Vault seeds for the
      # Java services, so the forward JWT minted by spe-api verifies here).
      PLM_SERVICE_SECRET:                  ${PLM_SERVICE_SECRET:?}
      PLM_PLATFORM_URL:                    http://platform-api:8084
      SPE_SELF_BASE_URL:                   http://webdav:8089
      NATS_URL:                            nats://nats:4222
      PLM_NATS_ENABLED:                    "true"
      OTEL_EXPORTER_OTLP_ENDPOINT:         http://jaeger:4318
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      psm-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - plm-net

  # ============================================================
  # DST — Data Store. Stores binary blobs on a local volume; SHA-256
  # computed at upload, every action audited via standard application log.
  # ============================================================
  dst:
    build:
      context: .
      dockerfile: dst/Dockerfile
      target: runtime
    image: dst:dev
    container_name: dst
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres:5432/plmdb
      SPRING_DATASOURCE_USERNAME:          plm
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_HIKARI_SCHEMA:     dst
      SPRING_JOOQ_SQL_DIALECT:             POSTGRES
      SPRING_FLYWAY_LOCATIONS:             classpath:db/migration
      SPRING_FLYWAY_DEFAULT_SCHEMA:        dst
      SPRING_FLYWAY_CREATE_SCHEMAS:        "true"
      VAULT_ADDR:                          http://vault:8200
      VAULT_TOKEN:                         plm-demo-services
      SPE_API_URL:                         http://spe-api:8082
      SPE_SELF_BASE_URL:                   http://dst:8086
      PNO_API_URL:                         http://pno-api:8081
      PLM_PERMISSION_ENABLED:              "true"
      PLM_PLATFORM_URL:                    http://platform-api:8084
      PLM_SETTINGS_ENABLED:                "true"
      DST_S3_ENDPOINT:                     http://garage:3900
      DST_S3_PUBLIC_ENDPOINT:              http://localhost:3000
      DST_S3_REGION:                       garage
      DST_S3_BUCKET:                       ${GARAGE_S3_BUCKET:-plm-dst}
      DST_S3_ACCESS_KEY:                   ${GARAGE_S3_ACCESS_KEY:?}
      DST_S3_SECRET_KEY:                   ${GARAGE_S3_SECRET_KEY:?}
      MANAGEMENT_OTLP_TRACING_ENDPOINT:    http://jaeger:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      LOGGING_LEVEL_ROOT:                  INFO
      LOGGING_LEVEL_COM_DST:               INFO
      NATS_URL:                            nats://nats:4222
      PLM_NATS_ENABLED:                    "true"
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
      garage-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - plm-net

  # ============================================================
  # SPE API — Gateway, service registry, auth (sole external entry)
  # ============================================================
  spe-api:
    build:
      context: .
      dockerfile: spe-api-rs/Dockerfile
      target: runtime
    image: spe-api:dev
    container_name: spe-api
    ports:
      - "8082:8082"
    environment:
      # Rust rewrite — secret injected directly (same value Vault seeds for the
      # Java services, so JWTs verify across the Java↔Rust boundary).
      PLM_SERVICE_SECRET:                  ${PLM_SERVICE_SECRET:?}
      PNO_API_URL:                         http://pno-api:8081
      PLM_PLATFORM_URL:                    http://platform-api:8084
      SPE_SELF_BASE_URL:                   http://spe-api:8082
      NATS_URL:                            nats://nats:4222
      PLM_NATS_ENABLED:                    "true"
      OTEL_EXPORTER_OTLP_ENDPOINT:         http://jaeger:4318
      RUST_LOG:                            "info,spe_api=debug"
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
      jaeger:
        condition: service_healthy
      nats:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - plm-net

  # ============================================================
  # Frontend — Vite build served by nginx
  # ============================================================
  plm-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: plm-core-frontend:latest
    container_name: plm-frontend
    ports:
      - "3000:80"
    depends_on:
      spe-api:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - plm-net

  # ============================================================
  # CAD PARSER — Python+OCC sidecar. Parses STEP/CATIA files → JSON tree.
  # Internal only, no external port.
  # ============================================================
  cad-parser:
    build:
      context: ./cad-parser
      dockerfile: Dockerfile
    image: cad-parser:dev
    container_name: cad-parser
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node --input-type=commonjs -e \"require('http').get('http://localhost:8090/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - plm-net

  # ============================================================
  # CAD API — CAD ingestion service. Accepts STEP/CATIA uploads,
  # drives PSM node creation via import context algorithm.
  # ============================================================
  cad-api:
    build:
      context: .
      dockerfile: cad-api/Dockerfile
      target: runtime
    image: cad-api:dev
    container_name: cad-api
    environment:
      SPRING_DATASOURCE_URL:               jdbc:postgresql://postgres:5432/plmdb
      SPRING_DATASOURCE_USERNAME:          plm
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_HIKARI_SCHEMA:     cad
      SPRING_JOOQ_SQL_DIALECT:             POSTGRES
      SPRING_FLYWAY_LOCATIONS:             classpath:db/migration
      SPRING_FLYWAY_DEFAULT_SCHEMA:        cad
      SPRING_FLYWAY_CREATE_SCHEMAS:        "true"
      VAULT_ADDR:                          http://vault:8200
      VAULT_TOKEN:                         plm-demo-services
      SPE_API_URL:                         http://spe-api:8082
      SPE_SELF_BASE_URL:                   http://cad-api:8087
      PNO_API_URL:                         http://pno-api:8081
      PLM_PLATFORM_URL:                    http://platform-api:8084
      PLM_PERMISSION_ENABLED:              "true"
      PLM_SETTINGS_ENABLED:                "true"
      NATS_URL:                            nats://nats:4222
      PLM_NATS_ENABLED:                    "true"
      CAD_PARSER_URL:                      http://cad-parser:8090
      MANAGEMENT_OTLP_TRACING_ENDPOINT:    http://jaeger:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      LOGGING_LEVEL_ROOT:                  INFO
      LOGGING_LEVEL_COM_CAD:               INFO
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      nats:
        condition: service_healthy
      cad-parser:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - plm-net

  search-api:
    build:
      context: .
      dockerfile: search-api/Dockerfile
      target: runtime
    image: search-api:dev
    container_name: search-api
    environment:
      VAULT_ADDR:                          http://vault:8200
      VAULT_TOKEN:                         plm-demo-services
      PLM_PLATFORM_URL:                    http://platform-api:8084
      SPE_SELF_BASE_URL:                   http://search-api:8088
      PLM_SETTINGS_ENABLED:                "true"
      PLM_NATS_ENABLED:                    "true"
      NATS_URL:                            nats://nats:4222
      SEARCH_INDEX_PATH:                   /var/lib/search-data
      MANAGEMENT_OTLP_TRACING_ENDPOINT:    http://jaeger:4318/v1/traces
      MANAGEMENT_TRACING_ENABLED:          "true"
      LOGGING_LEVEL_ROOT:                  INFO
      LOGGING_LEVEL_COM_PLM_SEARCH:        INFO
    volumes:
      - plm-search-data:/var/lib/search-data
    depends_on:
      vault:
        condition: service_healthy
      nats:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - plm-net

networks:
  plm-net:
    driver: bridge

volumes:
  plm-pgdata:
    driver: local
  plm-vault-file:
    driver: local
  plm-vault-init:
    driver: local
  plm-garage-meta:
    driver: local
  plm-garage-data:
    driver: local
  plm-search-data:
    driver: local
