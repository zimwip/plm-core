# ============================================================
# Garage — S3-compatible object store (single-node demo config)
#
# rpc_secret + admin_token are NOT set here: Garage reads them from
# GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN env vars (see docker-compose.yml).
#
# DEMO ONLY. replication_factor=1, no TLS, single node.
# ============================================================
metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "sqlite"

replication_factor = 1

rpc_bind_addr   = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region     = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
