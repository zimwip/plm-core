# Plain HTTP → permanent redirect to HTTPS. nginx is the sole external entry
# point and only exposes TLS; everything behind it stays plain http internally.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Self-signed localhost cert, mounted read-only from ./certs (see compose).
    # Swap the files + restart the container to replace it — no rebuild.
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Plain HTTP hitting this TLS port (e.g. http://localhost:3000) triggers
    # nginx error 497. Silently redirect to https on the same client-facing
    # port. $http_host preserves the port the browser used (3000), whereas
    # $server_port would be the in-container 443.
    error_page 497 https://$http_host$request_uri;

    client_max_body_size 1024M;
    root /usr/share/nginx/html;
    index index.html;

    # With a literal hostname in proxy_pass, nginx resolves once at startup
    # and never re-resolves — so recreating a container breaks routing.
    # Fix: use DNS resolver + $variable in proxy_pass.
    # __NGINX_RESOLVER__ is replaced at container startup by docker-entrypoint.sh
    # from /etc/resolv.conf (Docker → 127.0.0.11, Podman → bridge IP).
    resolver __NGINX_RESOLVER__ valid=10s ipv6=off;

    # All /api/* goes to spe-api (the gateway).
    # ^~ suppresses regex matching so static asset caching block doesn't intercept
    # /api/**/*.js files (e.g. psm-api UI bundles at /api/psm/ui/nav.js).
    location ^~ /api/ {
        set $spe spe-api:8082;
        proxy_pass         http://$spe;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-PLM-User         $http_x_plm_user;
        proxy_set_header   X-PLM-Tx           $http_x_plm_tx;
        proxy_set_header   X-PLM-ProjectSpace $http_x_plm_projectspace;
    }

    # Presigned S3 object URLs → Garage. dst hands these out for the DOWNLOAD
    # action and the 3D preview. Routing through nginx keeps them same-origin
    # (no CORS, satisfies CSP connect-src 'self'). Host is forwarded verbatim
    # so the SigV4 signature — signed by dst for this origin — still validates
    # at Garage. The bucket name is part of the path (path-style addressing).
    location ^~ /plm-dst/ {
        set $garage garage:3900;
        proxy_pass         http://$garage;
        proxy_http_version 1.1;
        proxy_set_header   Host      $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # WebSocket → spe-api (which proxies to ws-gateway through gateway routing).
    #
    # ws-gateway runs with context-path=/api/ws and the WebSocket handler is registered
    # at "/", so the only URI that matches the handler is "/api/ws/" (with trailing slash).
    # Tomcat normally 302-redirects "/api/ws" → "/api/ws/", but reactor-netty's WebSocket
    # client refuses to follow redirects during the upgrade handshake, and browsers do
    # not reliably follow 3xx during the WS upgrade either. We rewrite at the edge via
    # proxy_pass URI so nginx forwards the corrected path without ever emitting a 3xx.
    location = /api/ws {
        set $spe spe-api:8082;
        proxy_pass         http://$spe/api/ws/$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-PLM-User $http_x_plm_user;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ws/ {
        set $spe spe-api:8082;
        proxy_pass         http://$spe;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-PLM-User $http_x_plm_user;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Actuator (health/metrics) is intentionally NOT proxied here — it must stay
    # internal to the compose network (docker-compose healthchecks hit it on the
    # service's internal port). The frontend reconnect probe uses the public
    # /api/platform/status route instead. Browser requests to /actuator/* fall
    # through to the SPA fallback below.

    # OpenAPI spec + Swagger UI (served by psm-api, routed through spe gateway).
    # The API Playground fetches /v3/api-docs to render the endpoint catalog.
    location /v3/api-docs {
        set $spe spe-api:8082;
        proxy_pass         http://$spe;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   Authorization      $http_authorization;
    }
    location /swagger-ui/ {
        set $spe spe-api:8082;
        proxy_pass         http://$spe;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   Authorization      $http_authorization;
    }

    # Security headers
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "DENY"            always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "no-referrer"     always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss:; img-src 'self' data:" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|wasm|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
