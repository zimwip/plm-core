spring.application.name=webdav
server.port=8089

# Vault (resolves plm.service.secret, plm.jwt.*)
spring.config.import=vault://
spring.cloud.vault.uri=${VAULT_ADDR:http://vault:8200}
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=${VAULT_TOKEN:plm-demo-services}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.application-name=plm
spring.cloud.vault.kv.default-context=plm
spring.cloud.vault.fail-fast=true
spring.cloud.vault.retry.enabled=true
spring.cloud.vault.retry.initial-interval=1500
spring.cloud.vault.retry.max-interval=10000
spring.cloud.vault.retry.multiplier=1.5
spring.cloud.vault.retry.max-attempts=15

# Shared platform-lib auth filter (Bearer fwd-JWT from spe-api)
plm.auth.service-secret=${plm.service.secret}
plm.auth.clock-skew-seconds=${plm.jwt.clock-skew-seconds:5}
plm.auth.public-paths=/actuator/**,/v3/api-docs/**,/swagger-ui/**

# platform-api self-registration — drives /api/dav context-path
platform.registration.service-code=dav
platform.registration.self-base-url=${SPE_SELF_BASE_URL:http://webdav:8089}
platform.registration.platform-url=${PLM_PLATFORM_URL:http://platform-api:8084}
platform.registration.service-secret=${plm.service.secret}
platform.registration.space-tag=${SPE_SPACE_TAG:}

# Config snapshot from psm-admin (webdav.directory / webdav.file metadata)
# webdav only reads ConfigCache — the action framework (dispatcher) needs an
# ActionNodeContextPort impl we don't have, so exclude it.
spring.autoconfigure.exclude=com.plm.platform.action.ActionFrameworkAutoConfiguration
psm.config.admin-url=${PSM_CONFIG_ADMIN_URL:http://psm-admin:8083}
psm.config.service-code=${PSM_CONFIG_SERVICE_CODE:dav-config}
psm.config.self-base-url=${PSM_CONFIG_SELF_BASE_URL:http://webdav:8089}
psm.config.service-secret=${plm.service.secret:}

# Permissions enforced downstream by psm/dst — none locally
plm.permission.enabled=false
plm.settings.enabled=false

# NATS (CONFIG_CHANGED refresh)
plm.nats.enabled=${PLM_NATS_ENABLED:false}
plm.nats.url=${NATS_URL:nats://nats:4222}
plm.nats.connection-name=webdav

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenTelemetry tracing
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://jaeger:4318/v1/traces
management.otlp.tracing.transport=http
otel.service.name=webdav
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# WebDAV clients PROPFIND the bare context root "/api/dav" — don't 302 to "/api/dav/"
server.tomcat.redirect-context-root=false
