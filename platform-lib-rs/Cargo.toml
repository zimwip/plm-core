[package]
name = "platform-lib-rs"
version = "0.1.0"
edition = "2021"
description = "Minimal Rust port of platform-lib: JWT, service registry, registration, NATS, S2S client. Reproduces the PLM Core wire contracts."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
async-nats = "0.38"
futures = "0.3"
sha1 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
arc-swap = "1"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
http = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util", "macros"] }
